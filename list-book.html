
<!DOCTYPE html>
<html>
<head>
    <title>List a Book</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <h2>Campus Book Exchange</h2>
        <div>
            <a href="index.html">Home</a>
            <a href="books.html">Browse Books</a>
            <a href="list-book.html">List a Book</a>
        </div>
    </div>

    <div class="container">
        <h1 id="formHeading">List Your Book</h1>

        <button onclick="changeSize()">Change Heading Size</button>
        <button onclick="hideForm()">Show / Hide Form</button>

        <form id="bookForm" onsubmit="submitBook(event)">
            <label>Student Name</label>
            <input type="text" id="studentName" placeholder="Enter your name">

            <label>Book Title</label>
            <input type="text" id="title" placeholder="Enter book title">

            <label>Author</label>
            <input type="text" id="author" placeholder="Enter author name">

            <label>Subject / Category</label>
            <input type="text" id="category" placeholder="Enter category">

            <label>Book Condition</label>
            <select id="condition">
                <option value="">Select condition</option>
                <option>New</option>
                <option>Very Good</option>
                <option>Good</option>
                <option>Used</option>
            </select>

            <button type="submit">Submit</button>
        </form>

        <p id="formMessage"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
